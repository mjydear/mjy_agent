name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality-baseline:
    # Existing formatting and typing debt is tracked here until it is paid down.
    # Product tests remain blocking in their own jobs.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e .
      - run: black --check athena tests examples
      - run: isort --check-only athena tests examples
      - run: mypy athena

  unit-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e .
      - run: >-
          pytest -m "not integration and not k8s_live and not benchmark"
          --junitxml=junit.xml
          --cov=athena --cov-report=xml --cov-report=term-missing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-api-results
          path: |
            junit.xml
            coverage.xml

  integration-redis:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e .
      - run: pytest -m integration --junitxml=integration-redis.xml
        env:
          ATHENA_REDIS_URL: redis://localhost:6379/0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-redis-results
          path: integration-redis.xml
