[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"

[tool.mypy]
python_version = "3.12"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
    "integration: 需要真实外部依赖(Redis/Milvus 等)的集成测试，缺依赖时自动跳过",
    "unit: 不依赖外部服务的快速单元测试",
    "concurrency: 并发、租约、幂等和 SSE 正确性测试",
    "benchmark: Agent 基准评测契约与回归测试",
    "k8s_live: 需要受控真实 Kubernetes 集群的测试",
    "security: Tenant、Scope、Secret 与风险边界测试",
    "slow: 耗时较长的测试",
]

[[tool.mypy.overrides]]
module = [
    "pymilvus",
    "RestrictedPython",
    "RestrictedPython.Guards",
]
ignore_missing_imports = true

[tool.coverage.run]
omit = [
    "athena/cli/*",
    "athena/infra/observability.py",
    "athena/integration/*",
    "athena/observability/web/*",
    "athena/memory/governance.py",
    "athena/memory/profile.py",
    "athena/tools/builtin/code.py",
    "athena/tools/builtin/files.py",
    "athena/tools/builtin/git.py",
    "athena/tools/executor.py",
]

[tool.coverage.report]
fail_under = 80
