# Alertmanager 配置：Athena Agent 告警路由与通知
# 加载方式：alertmanager --config.file=monitoring/alertmanager.yml
# 设计：按 severity 分级路由；critical 走即时通道并抑制同源 warning。
global:
  resolve_timeout: 5m

# 抑制规则：同一告警源已触发 critical 时，抑制其 warning，减少噪音
inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [slo]

route:
  receiver: athena-default
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # critical → 立即通知，重复间隔更短
    - receiver: athena-critical
      matchers: [severity="critical"]
      group_wait: 10s
      repeat_interval: 1h
      continue: true
    # SLO 相关告警单独归组，方便值班关注错误预算
    - receiver: athena-slo
      matchers: [slo=~"availability|latency"]

receivers:
  - name: athena-default
    webhook_configs:
      # 对接 athena/integration/alert_webhook.py 暴露的入口（自愈/降噪）
      - url: http://athena-app:8000/api/alerts/webhook
        send_resolved: true

  - name: athena-critical
    webhook_configs:
      - url: http://athena-app:8000/api/alerts/webhook
        send_resolved: true
    # 生产可在此追加 pagerduty_configs / slack_configs / email_configs

  - name: athena-slo
    webhook_configs:
      - url: http://athena-app:8000/api/alerts/webhook
        send_resolved: true
