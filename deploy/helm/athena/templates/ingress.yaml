{{- if .Values.api.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: athena-api
  labels:
    {{- include "athena.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.api.ingress.className | quote }}
  rules:
    - host: {{ .Values.api.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: athena-api
                port:
                  number: 80
{{- end }}
