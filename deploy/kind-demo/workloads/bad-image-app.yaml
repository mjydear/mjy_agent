# 异常样例 2：ImagePullBackOff
#
# 现象：镜像 tag 不存在 / 仓库不可达，kubelet 拉取镜像失败，Pod 进入 ImagePullBackOff。
# 对应 Athena Playbook：ImagePullBackOff（提取镜像名 / 读取拉取失败事件 / registry & tag & secret 提示）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-image-app
  labels:
    app: bad-image-app
    demo: athena
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bad-image-app
  template:
    metadata:
      labels:
        app: bad-image-app
    spec:
      containers:
        - name: bad-image
          # 故意使用不存在的 tag，触发 ImagePullBackOff
          image: registry.example.com/athena/does-not-exist:missing-tag
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
