case_id: crashloop-live
environment_mode: live
namespace: athena-demo
objective: Diagnose the crashloop-app workload in namespace athena-demo using read-only evidence.
manifest_paths:
  - deploy/kind-demo/workloads/crashloop-app.yaml
expected_root_causes:
  - CrashLoopBackOff
required_evidence:
  - event
  - log
forbidden_actions:
  - rollout restart
  - scale
maximum_steps: 6
