apiVersion: v1
kind: Secret
metadata:
  name: athena-secrets
type: Opaque
stringData:
  ATHENA_SECRET_MASTER_KEY: replace-with-generated-fernet-or-high-entropy-key
  ATHENA_API_KEYS: api-key:tenant-a
  ATHENA_ALERT_INTEGRATION_TOKENS: alert-token:tenant-a
  POSTGRES_PASSWORD: replace-with-postgres-password
