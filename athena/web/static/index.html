<!--
📦 模块名称：Athena Web Console HTML 页面骨架
📍 架构位置：浏览器展示层入口，负责定义三栏式页面结构，被 FastAPI 静态资源服务返回。
🎯 核心作用：提供会话列表、聊天区、详情面板这些 DOM 容器，让 app.js 能动态填充内容。
🔗 依赖关系：依赖 Tailwind CDN、style.css 和 app.js；被 athena/api/server.py 的静态挂载依赖。
💡 设计思路：HTML 只放结构，交互逻辑放 app.js，少量视觉样式交给 Tailwind + style.css。
📚 学习重点：看左中右三栏如何对应“会话/对话/观测详情”三个产品区域。
-->
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" /> <!-- 💡 学习提示：viewport 让页面在手机和桌面都按设备宽度布局。 -->
    <title>Athena Agent Web Console</title>
    <link rel="stylesheet" href="/static/styles/tokens.css?v=20260719-02" />
    <link rel="stylesheet" href="/static/styles/layout.css?v=20260719-02" />
    <link rel="stylesheet" href="/static/styles/components.css?v=20260719-02" />
    <link rel="stylesheet" href="/static/styles/pages.css?v=20260719-02" />
    <link rel="stylesheet" href="/static/styles/runtime-console.css?v=20260809-01" />
    <link rel="stylesheet" href="/static/style.css?v=20260713-01" />
  </head>
  <body class="min-h-screen bg-[#f7f8fb] text-[#1d1d2b]">
    <!-- 🔍 原理讲解：main 是整个控制台的布局容器。窄屏幕用 flex-col 垂直堆叠，中等以上 md:flex-row 变成三栏。 -->
    <main id="legacy-console" class="flex min-h-screen flex-col md:flex-row">
      <!-- 💡 学习提示：左侧栏负责“选择上下文”，包括会话和工作模式。id=sidebar 供收起/展开切换。 -->
      <aside id="sidebar" class="app-sidebar collapsed flex w-full flex-col border-b border-[#ececf1] bg-[#fbfbfd] p-2 md:border-b-0 md:border-r">
        <!-- 💡 学习提示：收起触发按钮位于侧边栏与主区交界，绝对定位在右边缘。 -->
        <button id="sidebar-toggle" class="sidebar-toggle" title="收起 / 展开侧边栏" aria-label="收起或展开侧边栏">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>

        <div class="sidebar-head mb-2 flex items-center gap-2">
          <div class="brand-logo h-9 w-9 flex-shrink-0 text-base font-bold">A</div>
          <div class="sb-text">
            <h1 class="text-sm font-semibold leading-tight text-[#1d1d2b]">Athena Agent</h1>
            <p class="text-[11px] text-[#8e8ea0]">Web Console</p>
          </div>
        </div>

        <button id="new-session" class="btn btn-primary new-session-btn mb-1.5 flex items-center gap-2">
          <svg class="flex-shrink-0" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          <span class="sb-text">新建会话</span>
        </button>

        <!-- 💡 学习提示：搜索框仅前端过滤会话列表，不额外请求后端。 -->
        <label class="search-box sb-collapsible mb-2">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="session-search" type="text" placeholder="搜索会话..." autocomplete="off" />
        </label>

        <!-- 💡 学习提示：访问模式改为下拉层级选择，默认收起，节省侧边栏空间。 -->
        <section class="sb-collapsible mb-2">
          <h2 class="sidebar-label">访问模式</h2>
          <div class="dropdown" id="mode-dropdown">
            <button type="button" class="dropdown-trigger" id="mode-trigger" aria-haspopup="listbox" aria-expanded="false">
              <span id="mode-current">单 Agent 对话</span>
              <svg class="dd-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="dropdown-menu" id="mode-menu" role="listbox"> <!-- 💡 学习提示：data-mode 是给 app.js 读取的状态标记，保持不变以复用原有逻辑。 -->
              <button data-mode="chat" class="mode-button active" role="option">单 Agent 对话</button>
              <button data-mode="workflow" class="mode-button" role="option">多 Agent 工作流</button>
              <button data-mode="benchmark" class="mode-button" role="option">Benchmark 评测</button>
              <button data-mode="cloud" class="mode-button" role="option">云运维模式</button>
              <button id="ops-task-mode" data-mode="ops-task" class="mode-button" role="option" hidden>故障任务</button>
            </div>
          </div>

          <!-- 💡 学习提示：仅当一级选中“云运维模式”时展开二级子选项。 -->
          <div class="cloud-submenu" id="cloud-mode-panel" hidden>
            <p class="submenu-label">云运维子模式</p>
            <div class="cloud-submenu-list">
              <button data-cloud-mode="k8s" class="cloud-mode-button active">K8s 运维</button>
              <button data-cloud-mode="resource" class="cloud-mode-button">资源巡检</button>
              <button data-cloud-mode="fault" class="cloud-mode-button">故障排查</button>
              <button data-cloud-mode="cost" class="cloud-mode-button">成本优化</button>
            </div>
          </div>
        </section>

        <section class="sb-collapsible min-h-0 flex-1">
          <h2 class="sidebar-label">会话列表</h2>
          <div id="session-list" class="flex flex-col gap-0.5 overflow-y-auto pr-0.5"></div> <!-- 💡 学习提示：空容器由 app.js 动态填充（含时间分组标题），避免 HTML 写死会话数据。 -->
        </section>

        <!-- 💡 学习提示：底部工具条呼应参考设计，跳转文档 / API / 指标；收起时纵向排列。 -->
        <div class="sidebar-footer">
          <a class="foot-btn" href="/docs" target="_blank" title="API 文档">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          </a>
          <a class="foot-btn" href="/api/metrics/prometheus" target="_blank" title="Prometheus 指标">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
          </a>
          <a class="foot-btn" href="/healthz" target="_blank" title="健康检查">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
          </a>
        </div>
      </aside>

      <!-- 💡 学习提示：中间主区域负责“执行任务”，类似聊天产品里的主工作台。 -->
      <section class="console-main flex min-h-[70vh] flex-1 flex-col bg-white">
        <header class="flex-shrink-0 border-b border-[#ececf1] px-5 py-3">
          <div class="flex flex-wrap items-center justify-between gap-3">
            <div>
              <p id="current-session" class="text-sm text-[#8e8ea0]">尚未创建会话</p>
              <h2 id="mode-title" class="mt-0.5 text-lg font-semibold text-[#1d1d2b]">单 Agent 对话</h2>
            </div>
            <div class="flex items-center gap-2">
              <!-- 💡 学习提示：模型选择器 + 内嵌状态指示灯，点击展开可切换模型。 -->
              <div class="dropdown model-dropdown" id="model-dropdown">
                <button type="button" class="model-trigger" id="model-trigger" aria-haspopup="listbox" aria-expanded="false">
                  <span class="dot" id="model-dot"></span>
                  <span id="model-current">配置模型</span>
                  <svg class="dd-chevron" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                </button>
                <div class="dropdown-menu model-menu" id="model-menu" role="listbox"></div>
              </div>
              <button id="api-key-trigger" class="llm-settings-btn" type="button" title="配置模型 API Key" aria-label="配置模型 API Key">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15 8 3 3"/><path d="m17 6 3 3"/></svg>
                <span id="api-key-state">未配置</span>
              </button>
              <div id="status-pill" class="status-pill status-pill--ready">Ready</div> <!-- 💡 学习提示：状态徽标让用户知道当前是否正在流式执行。 -->
            </div>
          </div>
        </header>

        <div id="chat-log" class="flex-1 space-y-4 overflow-y-auto p-5"></div> <!-- 💡 学习提示：聊天消息用 JS 添加，方便切换会话时整体重绘。 -->

        <section id="ops-task-workbench" class="ops-task-workbench" aria-labelledby="ops-task-heading" hidden>
          <div class="ops-task-toolbar">
            <div>
              <p class="ops-task-eyebrow">Readonly operations</p>
              <h3 id="ops-task-heading">CrashLoop 故障任务</h3>
            </div>
            <div class="ops-task-toolbar-actions">
              <span id="ops-task-connection" class="ops-task-connection" role="status" aria-live="polite">未连接</span>
              <button id="ops-task-refresh" class="icon-btn" type="button" title="刷新故障任务" aria-label="刷新故障任务">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6v6h-6"/><path d="M4 18v-6h6"/><path d="M18.5 9a7 7 0 0 0-11.8-2.6L4 9"/><path d="m20 15-2.7 2.6A7 7 0 0 1 5.5 15"/></svg>
              </button>
            </div>
          </div>

          <form id="ops-task-create" class="ops-task-create">
            <label class="ops-task-field ops-task-objective">
              <span>诊断目标</span>
              <textarea id="ops-task-objective" rows="2" maxlength="1000" required placeholder="例如：诊断 payment 服务的 CrashLoopBackOff"></textarea>
            </label>
            <label class="ops-task-field">
              <span>Environment ID</span>
              <input id="ops-task-environment" type="text" maxlength="120" value="env-local" required autocomplete="off" />
            </label>
            <label class="ops-task-field">
              <span>Namespace</span>
              <input id="ops-task-namespace" type="text" maxlength="120" value="default" required autocomplete="off" />
            </label>
            <button id="ops-task-submit" class="btn btn-primary ops-task-submit" type="submit">创建只读任务</button>
            <p id="ops-task-error" class="ops-task-error" role="alert"></p>
          </form>

          <div class="ops-task-layout">
            <nav class="ops-task-list-panel" aria-label="故障任务列表">
              <div class="ops-task-section-heading">
                <h4>最近任务</h4>
                <span id="ops-task-count">0</span>
              </div>
              <div id="ops-task-list" class="ops-task-list"></div>
            </nav>
            <section id="ops-task-detail" class="ops-task-detail" aria-label="故障任务详情">
              <div class="ops-task-empty">选择一个任务查看状态、阶段事件与证据。</div>
            </section>
          </div>
        </section>

        <footer id="console-composer" class="flex-shrink-0 border-t border-[#ececf1] bg-white p-3">
          <div class="composer">
            <textarea id="message-input" rows="1" placeholder="输入任务，Enter 发送，Shift+Enter 换行"></textarea>
            <button id="cancel-stream" class="ghost-btn" disabled title="取消当前流式任务" aria-label="取消">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
            </button>
            <button id="send-message" class="send-fab" title="发送" aria-label="发送">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
            </button>
          </div>
        </footer>
      </section>

      <!-- 💡 学习提示：右侧栏负责“解释过程”。默认收起（collapsed），把主区空间留给聊天，需要时点 » 展开。 -->
      <aside id="detail-aside" class="detail-aside collapsed border-t border-[#ececf1] bg-[#fbfbfd] md:border-l md:border-t-0">
        <div class="detail-header">
          <button id="toggle-detail" class="toggle-detail-btn" title="展开详情面板" aria-label="折叠或展开详情面板">«</button>
          <div class="tab-group" id="tab-group">
            <button data-tab="trace" class="tab-button active">对话轨迹</button>
            <button data-tab="metrics" class="tab-button">性能指标</button>
            <button data-tab="alerts" class="tab-button">告警记录</button>
            <button data-tab="benchmark" class="tab-button">Benchmark</button>
          </div>
        </div>
        <div id="detail-panel" class="detail-panel"></div> <!-- 💡 学习提示：详情面板由 app.js 根据当前 Tab 填充轨迹、指标或报告。 -->
      </aside>
    </main>
    <section id="module-app" class="module-app" hidden aria-live="polite"></section>
    <section id="runtime-console-root" hidden aria-live="polite"></section>
    <div id="api-key-modal" class="modal-backdrop" hidden>
      <form id="api-key-form" class="settings-modal">
        <div class="settings-modal-head">
          <div><h3>模型配置</h3><p class="settings-hint">凭证保存在服务端，页面不会读取已保存的密钥。</p></div>
          <button id="api-key-close" type="button" class="icon-btn" aria-label="关闭模型配置">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>
        <div id="llm-config-list" class="llm-config-list"></div>
        <label class="settings-field">
          <span>Provider</span>
          <select id="llm-provider" class="app-input">
            <option value="deepseek">DeepSeek</option><option value="openai">OpenAI</option>
            <option value="anthropic">Anthropic</option><option value="gemini">Google Gemini</option>
            <option value="dashscope">DashScope / Qwen</option><option value="ollama">Ollama</option>
            <option value="openai_compatible">OpenAI Compatible</option>
          </select>
        </label>
        <label class="settings-field">
          <span>显示名称</span>
          <input id="llm-display-name" class="app-input" type="text" autocomplete="off" placeholder="例如：DeepSeek 日常对话" />
        </label>
        <label class="settings-field">
          <span>Model</span>
          <input id="llm-model" class="app-input" type="text" autocomplete="off" placeholder="deepseek/deepseek-chat" />
        </label>
        <label class="settings-field" id="llm-base-url-field" hidden>
          <span>Base URL</span>
          <input id="llm-base-url" class="app-input" type="url" autocomplete="off" placeholder="http://localhost:11434" />
        </label>
        <label class="settings-field">
          <span>API Key</span>
          <input id="llm-api-key" class="app-input" type="password" autocomplete="off" placeholder="sk-..." />
        </label>
        <div class="settings-actions">
          <span id="llm-form-error" class="form-error" role="alert"></span>
          <button class="btn btn-primary" type="submit">添加并启用</button>
        </div>
      </form>
    </div>
    <script src="/static/ops-task-workbench.js?v=20260713-01"></script>
    <script src="/static/app.js?v=20260719-01"></script>
    <script type="module" src="/static/main.js?v=20260719-03"></script>
  </body>
</html>

<!--
🤔 思考题：

1. 如果要新增“工具调用详情”面板，你会在右侧栏增加 Tab 还是新开页面？
2. 为什么这里不把会话列表写死在 HTML 里？
3. 如果项目变大，HTML 结构是否应该拆成模板或组件？
4. ⚡ 优化建议：未来可以给主要按钮增加 aria-label，提高无障碍访问体验。
-->
