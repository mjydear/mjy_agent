# 异常样例 3：Pending / Unschedulable
#
# 现象：Pod 请求的资源（此处为超大内存）没有任何节点能满足，调度器无法分配节点，
#       Pod 长期停留在 Pending，事件中出现 FailedScheduling / Insufficient memory。
# 对应 Athena Playbook：Pending（读取调度失败事件 / 资源不足 / 节点选择器 / 污点提示）。
apiVersion: v1
kind: Pod
metadata:
  name: pending-pod
  labels:
    app: pending-pod
    demo: athena
spec:
  containers:
    - name: pending
      image: nginx:1.27-alpine
      resources:
        requests:
          # 请求 1Ti 内存，本地 kind 节点无法满足，制造 Pending
          memory: "1024Gi"
          cpu: "50m"
