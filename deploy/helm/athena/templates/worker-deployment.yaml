apiVersion: apps/v1
kind: Deployment
metadata:
  name: athena-worker
  labels:
    {{- include "athena.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: athena
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: athena
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: athena
      containers:
        - name: athena-worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "athena.cli.main", "worker"]
          envFrom:
            - secretRef:
                name: {{ .Values.secretRefs.existingSecret }}
          env:
            - name: ATHENA_RUNTIME_PROFILE
              value: {{ .Values.config.runtimeProfile | quote }}
            - name: ATHENA_REDIS_URL
              value: {{ .Values.config.redisUrl | quote }}
            - name: ATHENA_DATABASE_URL
              value: {{ .Values.config.databaseUrl | quote }}
            - name: ATHENA_DATABASE_AUTO_MIGRATE
              value: "false"
            - name: ATHENA_EVIDENCE_LOCAL_ROOT
              value: {{ .Values.config.evidenceLocalRoot | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
