{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: athena-default-deny-except-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: athena
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.api.port }}
  egress:
    - {}
{{- end }}
