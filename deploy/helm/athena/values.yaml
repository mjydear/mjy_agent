image:
  repository: athena
  tag: latest
  pullPolicy: IfNotPresent

api:
  replicas: 2
  port: 8000
  ingress:
    enabled: false
    className: ""
    host: athena.local

worker:
  replicas: 2

migration:
  enabled: true

config:
  runtimeProfile: production
  redisUrl: redis://athena-redis:6379/0
  databaseUrl: postgresql+asyncpg://athena:$(POSTGRES_PASSWORD)@athena-postgres:5432/athena
  evidenceLocalRoot: /app/data/evidence

secretRefs:
  existingSecret: athena-secrets
  secretMasterKey: ATHENA_SECRET_MASTER_KEY
  apiKeys: ATHENA_API_KEYS
  alertIntegrationTokens: ATHENA_ALERT_INTEGRATION_TOKENS

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

pdb:
  minAvailable: 1

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

networkPolicy:
  enabled: true
