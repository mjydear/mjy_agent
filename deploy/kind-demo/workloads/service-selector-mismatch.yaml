# 异常样例 4：Service selector mismatch
#
# 现象：Deployment 的 Pod 标签为 app=web-backend，但 Service 的 selector 写成
#       app=web-frontend，两者不匹配，导致 Service 没有任何 Endpoints，流量无法到达后端。
# 对应 Athena Playbook：Service 无 Endpoints（对比 selector 与 Pod 标签 / 提示 selector 不匹配）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-backend
  labels:
    app: web-backend
    demo: athena
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-backend
  template:
    metadata:
      labels:
        app: web-backend
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: web-backend
  labels:
    app: web-backend
    demo: athena
spec:
  # selector 故意写错为 web-frontend，与 Pod 标签 web-backend 不匹配 → 无 Endpoints
  selector:
    app: web-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
