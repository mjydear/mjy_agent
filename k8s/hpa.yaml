# 水平自动扩缩容：CPU/内存利用率超阈值时在 2~10 副本间伸缩
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: athena-api
  namespace: athena
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: athena-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    # 自定义指标扩缩容（需部署 prometheus-adapter 暴露该指标，否则忽略此项）
    - type: Pods
      pods:
        metric:
          name: athena_http_requests_per_second
        target:
          type: AverageValue
          averageValue: "50"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120  # 缩容前观察 2 分钟，避免抖动
