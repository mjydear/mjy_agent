# kind 集群配置：本地真实云运维演示环境
#
# 用途：一键创建一个单控制面节点 + 一个工作节点的本地 Kubernetes 集群，
#       供 Athena 真实 K8s 只读诊断（ops.mode=real）联调使用。
#
# 使用：kind create cluster --name athena-demo --config kind-cluster.yaml
#
# 端口映射说明：
#   - 30090 → Prometheus NodePort，宿主机可通过 http://localhost:30090 访问。
#   - 30093 → Alertmanager NodePort（如需真实 Alertmanager，可自行扩展）。
apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
name: athena-demo
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30090
        hostPort: 30090
        protocol: TCP
      - containerPort: 30093
        hostPort: 30093
        protocol: TCP
  - role: worker
