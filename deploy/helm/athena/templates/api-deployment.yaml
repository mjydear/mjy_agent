apiVersion: apps/v1
kind: Deployment
metadata:
  name: athena-api
  labels:
    {{- include "athena.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: athena
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: athena
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: athena
      containers:
        - name: athena-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uvicorn", "athena.api.asgi:app", "--host", "0.0.0.0", "--port", "{{ .Values.api.port }}", "--workers", "1"]
          ports:
            - containerPort: {{ .Values.api.port }}
          envFrom:
            - secretRef:
                name: {{ .Values.secretRefs.existingSecret }}
          env:
            - name: ATHENA_RUNTIME_PROFILE
              value: {{ .Values.config.runtimeProfile | quote }}
            - name: ATHENA_REDIS_URL
              value: {{ .Values.config.redisUrl | quote }}
            - name: ATHENA_DATABASE_URL
              value: {{ .Values.config.databaseUrl | quote }}
            - name: ATHENA_DATABASE_AUTO_MIGRATE
              value: "false"
            - name: ATHENA_EVIDENCE_LOCAL_ROOT
              value: {{ .Values.config.evidenceLocalRoot | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.api.port }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.api.port }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
